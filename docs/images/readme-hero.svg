<svg width="1400" height="720" viewBox="0 0 1400 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#081C3A"/>
      <stop offset="0.55" stop-color="#0F4C5C"/>
      <stop offset="1" stop-color="#1E7F71"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D35E"/>
      <stop offset="1" stop-color="#EE964B"/>
    </linearGradient>
    <filter id="shadow" x="-40" y="-40" width="1480" height="800" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#041124" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1400" height="720" rx="36" fill="url(#bg)"/>
  <circle cx="1210" cy="120" r="220" fill="#F4D35E" fill-opacity="0.08"/>
  <circle cx="180" cy="600" r="180" fill="#FFFFFF" fill-opacity="0.05"/>
  <path d="M1085 0H1400V225C1322 236 1243 210 1183 154C1141 115 1110 62 1085 0Z" fill="#FFFFFF" fill-opacity="0.05"/>

  <g filter="url(#shadow)">
    <rect x="58" y="54" width="1284" height="612" rx="30" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.14"/>
  </g>

  <rect x="92" y="95" width="182" height="42" rx="21" fill="url(#accent)"/>
  <text x="183" y="121" text-anchor="middle" fill="#081C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Recruiter Snapshot</text>

  <text x="92" y="218" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="60" font-weight="700">
    <tspan x="92" dy="0">Streaming RAG for</tspan>
    <tspan x="92" dy="72">Financial Compliance</tspan>
  </text>

  <text x="92" y="343" fill="#D7F3EE" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400">
    <tspan x="92" dy="0">Production-minded Retrieval-Augmented Generation system for grounded answers</tspan>
    <tspan x="92" dy="38">over SEBI regulations, regulatory circulars, and compliance documents.</tspan>
  </text>

  <g>
    <rect x="92" y="412" width="210" height="88" rx="20" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="119" y="447" fill="#9FE6D7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Corpus</text>
    <text x="119" y="487" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">41 PDFs</text>
  </g>

  <g>
    <rect x="320" y="412" width="250" height="88" rx="20" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="347" y="447" fill="#9FE6D7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Retrieval</text>
    <text x="347" y="487" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Hybrid Search</text>
  </g>

  <g>
    <rect x="588" y="412" width="210" height="88" rx="20" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="615" y="447" fill="#9FE6D7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Benchmark</text>
    <text x="615" y="487" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">MRR@10 0.94</text>
  </g>

  <g>
    <rect x="872" y="110" width="410" height="124" rx="26" fill="#FFFFFF" fill-opacity="0.11" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="906" y="150" fill="#F4D35E" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Core Capabilities</text>
    <text x="906" y="188" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600">FastAPI streaming + LangGraph orchestration</text>
    <text x="906" y="216" fill="#D7F3EE" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400">Guardrails, query rewrite, cache routing, retrieval, memory, and grounded generation</text>
  </g>

  <g>
    <rect x="872" y="254" width="410" height="124" rx="26" fill="#FFFFFF" fill-opacity="0.11" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="906" y="294" fill="#F4D35E" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">State and Storage</text>
    <text x="906" y="332" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600">Pinecone + Postgres + LangCache</text>
    <text x="906" y="360" fill="#D7F3EE" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400">Hybrid vector retrieval, conversation history, and semantic answer reuse</text>
  </g>

  <g>
    <rect x="872" y="398" width="410" height="124" rx="26" fill="#FFFFFF" fill-opacity="0.11" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="906" y="438" fill="#F4D35E" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">What It Demonstrates</text>
    <text x="906" y="476" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600">Applied LLM systems engineering</text>
    <text x="906" y="504" fill="#D7F3EE" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400">Ingestion, evaluation, APIs, data stores, prompt safety, and production-aware design</text>
  </g>

  <text x="92" y="594" fill="#D7F3EE" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500">
    Built with Python 3.12, FastAPI, LangGraph, Pinecone, Postgres, Streamlit, OpenAI, NVIDIA, and Guardrails AI
  </text>
