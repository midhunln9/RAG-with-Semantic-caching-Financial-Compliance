<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1600 1015" role="img" aria-labelledby="title desc">
  <title id="title">Streaming RAG System Design</title>
  <desc id="desc">Simple flow diagram of the Streaming RAG system showing ingestion, serving, storage, and evaluation components.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 46px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 22px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .panel { font: 700 18px 'Avenir Next', 'Segoe UI', Arial, sans-serif; letter-spacing: 2px; fill: #475569; }
      .node { font: 700 24px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .chip { font: 700 18px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 17px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1600" height="1015" fill="url(#bg)"/>

  <text x="800" y="78" text-anchor="middle" class="title">Streaming RAG System Design</text>
  <text x="800" y="118" text-anchor="middle" class="subtitle">Simple architecture flow</text>

  <rect x="60" y="170" width="460" height="520" rx="34" fill="#eef6ff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="570" y="170" width="460" height="520" rx="34" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <rect x="1080" y="170" width="460" height="520" rx="34" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <rect x="60" y="740" width="1480" height="210" rx="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="95" y="212" class="panel">INGESTION</text>
  <text x="605" y="212" class="panel">SERVING</text>
  <text x="1115" y="212" class="panel">STATE + MODELS</text>
  <text x="95" y="782" class="panel">EVALUATION</text>

  <rect x="100" y="255" width="380" height="78" rx="22" fill="#ffffff" stroke="#dbeafe" stroke-width="2" filter="url(#shadow)"/>
  <rect x="100" y="375" width="380" height="78" rx="22" fill="#ffffff" stroke="#dbeafe" stroke-width="2" filter="url(#shadow)"/>
  <rect x="100" y="495" width="380" height="78" rx="22" fill="#ffffff" stroke="#dbeafe" stroke-width="2" filter="url(#shadow)"/>
  <rect x="100" y="610" width="380" height="54" rx="18" fill="#ffffff" stroke="#dbeafe" stroke-width="2" filter="url(#shadow)"/>

  <text x="290" y="303" text-anchor="middle" class="node">PDF Corpus</text>
  <text x="290" y="423" text-anchor="middle" class="node">Chunking</text>
  <text x="290" y="543" text-anchor="middle" class="node">Dense + Sparse Embeddings</text>
  <text x="290" y="645" text-anchor="middle" class="node">Pinecone Index</text>

  <line x1="290" y1="333" x2="290" y2="375" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
  <line x1="290" y1="453" x2="290" y2="495" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
  <line x1="290" y1="573" x2="290" y2="610" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>

  <rect x="610" y="255" width="380" height="78" rx="22" fill="#ffffff" stroke="#fde68a" stroke-width="2" filter="url(#shadow)"/>
  <rect x="610" y="375" width="380" height="78" rx="22" fill="#ffffff" stroke="#fde68a" stroke-width="2" filter="url(#shadow)"/>
  <rect x="610" y="495" width="380" height="120" rx="22" fill="#ffffff" stroke="#fde68a" stroke-width="2" filter="url(#shadow)"/>
  <rect x="645" y="540" width="135" height="34" rx="17" fill="#fff7ed"/>
  <rect x="805" y="540" width="150" height="34" rx="17" fill="#fff7ed"/>
  <text x="712" y="562" text-anchor="middle" class="chip">Streamlit UI</text>
  <text x="880" y="562" text-anchor="middle" class="chip">FastAPI /chat</text>
  <rect x="610" y="635" width="380" height="54" rx="18" fill="#ffffff" stroke="#fde68a" stroke-width="2" filter="url(#shadow)"/>

  <text x="800" y="303" text-anchor="middle" class="node">User</text>
  <text x="800" y="423" text-anchor="middle" class="node">LangGraph Workflow</text>
  <text x="800" y="673" text-anchor="middle" class="node">Streaming Response</text>

  <line x1="800" y1="333" x2="800" y2="375" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="453" x2="800" y2="495" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="615" x2="800" y2="635" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>

  <rect x="1120" y="255" width="380" height="78" rx="22" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1120" y="375" width="380" height="78" rx="22" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1120" y="495" width="380" height="78" rx="22" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1120" y="610" width="380" height="54" rx="18" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#shadow)"/>

  <text x="1310" y="303" text-anchor="middle" class="node">Semantic Cache</text>
  <text x="1310" y="423" text-anchor="middle" class="node">Postgres Memory</text>
  <text x="1310" y="543" text-anchor="middle" class="node">LLM Providers</text>
  <text x="1310" y="645" text-anchor="middle" class="node">OpenAI + NVIDIA</text>

  <path d="M 990 420 C 1050 420 1060 294 1120 294" fill="none" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M 990 430 C 1060 430 1060 414 1120 414" fill="none" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M 990 440 C 1060 440 1060 534 1120 534" fill="none" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M 480 637 C 560 637 560 430 610 430" fill="none" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>

  <rect x="100" y="820" width="250" height="64" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="400" y="820" width="250" height="64" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="700" y="820" width="250" height="64" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1000" y="820" width="250" height="64" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1300" y="803" width="180" height="98" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>

  <text x="225" y="859" text-anchor="middle" class="node">Sample Chunks</text>
  <text x="525" y="859" text-anchor="middle" class="node">Generate Queries</text>
  <text x="825" y="859" text-anchor="middle" class="node">Run Retriever</text>
  <text x="1125" y="859" text-anchor="middle" class="node">Score with ranx</text>
  <text x="1390" y="845" text-anchor="middle" class="node">Metrics</text>
  <text x="1390" y="876" text-anchor="middle" class="label">MRR, nDCG, Hit Rate</text>

  <line x1="350" y1="852" x2="400" y2="852" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="852" x2="700" y2="852" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
  <line x1="950" y1="852" x2="1000" y2="852" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
  <line x1="1250" y1="852" x2="1300" y2="852" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
</svg>
