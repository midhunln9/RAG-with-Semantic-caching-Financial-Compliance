<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1600 1090" role="img" aria-labelledby="title desc">
  <title id="title">Streaming RAG Request Flow</title>
  <desc id="desc">Simple request flow diagram showing cache-hit and cache-miss paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 46px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 22px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .panel { font: 700 18px 'Avenir Next', 'Segoe UI', Arial, sans-serif; letter-spacing: 2px; fill: #475569; }
      .node { font: 700 22px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 17px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1600" height="1090" fill="url(#bg)"/>

  <text x="800" y="78" text-anchor="middle" class="title">Streaming RAG Request Flow</text>
  <text x="800" y="118" text-anchor="middle" class="subtitle">Simple cache-hit and cache-miss lifecycle</text>

  <rect x="80" y="200" width="1440" height="210" rx="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="115" y="242" class="panel">SHARED PATH</text>

  <rect x="120" y="275" width="240" height="72" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="420" y="275" width="240" height="72" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="720" y="275" width="240" height="72" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1020" y="275" width="240" height="72" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>

  <text x="240" y="319" text-anchor="middle" class="node">Receive Question</text>
  <text x="540" y="319" text-anchor="middle" class="node">Save User Turn</text>
  <text x="840" y="319" text-anchor="middle" class="node">Rewrite Query</text>
  <text x="1140" y="319" text-anchor="middle" class="node">Cache Lookup</text>

  <line x1="360" y1="311" x2="420" y2="311" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="311" x2="720" y2="311" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
  <line x1="960" y1="311" x2="1020" y2="311" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>

  <polygon points="1350,250 1450,311 1350,372 1250,311" fill="#fff7ed" stroke="#fdba74" stroke-width="3"/>
  <text x="1350" y="304" text-anchor="middle" class="node">Cache Hit?</text>

  <line x1="1260" y1="311" x2="1250" y2="311" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>

  <rect x="80" y="490" width="610" height="320" rx="34" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="115" y="532" class="panel">CACHE HIT</text>

  <rect x="120" y="575" width="250" height="72" rx="22" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="400" y="575" width="250" height="72" rx="22" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#shadow)"/>

  <text x="245" y="619" text-anchor="middle" class="node">Return Cached Answer</text>
  <text x="525" y="619" text-anchor="middle" class="node">Save Assistant Turn</text>

  <line x1="370" y1="611" x2="400" y2="611" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
  <line x1="1350" y1="372" x2="390" y2="490" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="770" y="454" class="label">yes</text>

  <rect x="910" y="490" width="610" height="430" rx="34" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="945" y="532" class="panel">CACHE MISS</text>

  <rect x="950" y="575" width="230" height="72" rx="22" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1250" y="575" width="230" height="72" rx="22" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1100" y="690" width="230" height="72" rx="22" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1100" y="790" width="230" height="72" rx="22" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#shadow)"/>

  <text x="1065" y="619" text-anchor="middle" class="node">Retrieve Docs</text>
  <text x="1365" y="619" text-anchor="middle" class="node">Load History</text>
  <text x="1215" y="734" text-anchor="middle" class="node">Build Prompt</text>
  <text x="1215" y="834" text-anchor="middle" class="node">Generate Answer</text>

  <line x1="1065" y1="647" x2="1185" y2="690" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
  <line x1="1365" y1="647" x2="1245" y2="690" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
  <line x1="1215" y1="762" x2="1215" y2="790" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
  <line x1="1350" y1="372" x2="1215" y2="490" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="1295" y="446" class="label">no</text>

  <rect x="410" y="955" width="780" height="74" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="1001" text-anchor="middle" class="node">Stream Response to Client</text>

  <line x1="525" y1="647" x2="700" y2="955" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
  <line x1="1215" y1="862" x2="900" y2="955" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
</svg>
