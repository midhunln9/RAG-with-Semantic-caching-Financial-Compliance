<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1480" viewBox="0 0 1000 1480" role="img" aria-labelledby="title desc">
  <title id="title">Runtime Request Flow</title>
  <desc id="desc">Large-format request flow for the financial compliance RAG system showing the shared request path, fast semantic-cache path, and full RAG path.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 42px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 22px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 500 22px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .panel-title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .step-label { font: 600 23px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .step-num { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1000" height="1480" fill="url(#bg)"/>

  <text x="500" y="64" text-anchor="middle" class="title">Runtime Request Flow</text>
  <text x="500" y="102" text-anchor="middle" class="subtitle">A fast cache-hit branch when possible, and a full grounded RAG branch when needed</text>

  <rect x="150" y="150" width="700" height="92" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="500" y="204" text-anchor="middle" class="box-title">1. User submits a question</text>

  <rect x="150" y="285" width="700" height="92" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="500" y="339" text-anchor="middle" class="box-title">2. Save the user message</text>

  <rect x="150" y="420" width="700" height="92" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="500" y="474" text-anchor="middle" class="box-title">3. Rewrite the query</text>
  <text x="500" y="502" text-anchor="middle" class="small">Normalize phrasing for better cache reuse and retrieval quality</text>

  <line x1="500" y1="242" x2="500" y2="285" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="500" y1="377" x2="500" y2="420" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>

  <polygon points="500,565 640,665 500,765 360,665" fill="#fff7ed" stroke="#fdba74" stroke-width="3"/>
  <text x="500" y="648" text-anchor="middle" class="box-title">4. Semantic</text>
  <text x="500" y="682" text-anchor="middle" class="box-title">cache hit?</text>

  <line x1="500" y1="512" x2="500" y2="565" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="50" y="810" width="410" height="430" rx="26" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="255" y="858" text-anchor="middle" class="panel-title">Fast Path: Cache Hit</text>
  <text x="255" y="889" text-anchor="middle" class="small">Lowest-latency response</text>

  <circle cx="115" cy="955" r="24" fill="#16a34a"/>
  <text x="115" y="962" text-anchor="middle" class="step-num">5</text>
  <rect x="160" y="925" width="250" height="58" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
  <text x="285" y="962" text-anchor="middle" class="step-label">Load cached answer</text>

  <circle cx="115" cy="1038" r="24" fill="#16a34a"/>
  <text x="115" y="1045" text-anchor="middle" class="step-num">6</text>
  <rect x="160" y="1008" width="250" height="58" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
  <text x="285" y="1045" text-anchor="middle" class="step-label">Persist assistant reply</text>

  <circle cx="115" cy="1121" r="24" fill="#16a34a"/>
  <text x="115" y="1128" text-anchor="middle" class="step-num">7</text>
  <rect x="160" y="1091" width="250" height="58" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
  <text x="285" y="1128" text-anchor="middle" class="step-label">Return answer immediately</text>

  <rect x="540" y="810" width="410" height="540" rx="26" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="745" y="858" text-anchor="middle" class="panel-title">Full Path: Cache Miss</text>
  <text x="745" y="889" text-anchor="middle" class="small">Run the complete grounded RAG workflow</text>

  <circle cx="605" cy="955" r="24" fill="#2563eb"/>
  <text x="605" y="962" text-anchor="middle" class="step-num">5</text>
  <rect x="650" y="925" width="250" height="58" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="775" y="962" text-anchor="middle" class="step-label">Run hybrid retrieval</text>

  <circle cx="605" cy="1038" r="24" fill="#2563eb"/>
  <text x="605" y="1045" text-anchor="middle" class="step-num">6</text>
  <rect x="650" y="1008" width="250" height="58" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="775" y="1045" text-anchor="middle" class="step-label">Load recent history</text>

  <circle cx="605" cy="1121" r="24" fill="#2563eb"/>
  <text x="605" y="1128" text-anchor="middle" class="step-num">7</text>
  <rect x="650" y="1091" width="250" height="58" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="775" y="1128" text-anchor="middle" class="step-label">Build grounded prompt</text>

  <circle cx="605" cy="1204" r="24" fill="#2563eb"/>
  <text x="605" y="1211" text-anchor="middle" class="step-num">8</text>
  <rect x="650" y="1174" width="250" height="58" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="775" y="1211" text-anchor="middle" class="step-label">Generate final answer</text>

  <circle cx="605" cy="1287" r="24" fill="#2563eb"/>
  <text x="605" y="1294" text-anchor="middle" class="step-num">9</text>
  <rect x="650" y="1257" width="250" height="58" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="775" y="1283" text-anchor="middle" class="step-label">Persist reply</text>
  <text x="775" y="1307" text-anchor="middle" class="small">and write the answer to semantic cache</text>

  <line x1="360" y1="665" x2="255" y2="810" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="640" y1="665" x2="745" y2="810" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="150" y="1375" width="700" height="72" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="500" y="1419" text-anchor="middle" class="box-title">10. Stream the answer back to the client</text>

  <line x1="255" y1="1240" x2="350" y2="1375" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="745" y1="1350" x2="650" y2="1375" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
